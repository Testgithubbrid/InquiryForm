<!DOCTYPE html>
<html>
<head>
    <title>Inquiry Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .form-box {
            background-color: #ffffff;
            width: 350px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #cccccc;
        }
        h2 {
            text-align: center;
            color: #333333;
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444444;
        }
        .inline-label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #bbbbbb;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .button-group {
            margin-top: 20px;
            text-align: center;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 0 5px;
        }
        .submit-btn {
            background-color: #28a745;
            color: white;
        }
        .signup-btn {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>INQUIRY FORM</h2>
        <form action="https://www.google.com/">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Email ID:</label>
            <input type="email" id="email" name="email" placeholder="Enter your Email" required>

            <label for="mobile">Mobile No:</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male" class="inline-label">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female" class="inline-label">Female</label>

            <label for="dob">DOB:</label>
            <input type="date" id="dob" name="dob">

            <label>Rating:</label>
            <input type="checkbox" name="rating" value="1"> 1
            <input type="checkbox" name="rating" value="2"> 2
            <input type="checkbox" name="rating" value="3"> 3
            <input type="checkbox" name="rating" value="4"> 4
            <input type="checkbox" name="rating" value="5"> 5

            <label for="feedback">Feedback:</label>
            <textarea id="feedback" name="feedback" rows="4" placeholder="Write your feedback here..."></textarea>

            <div class="button-group">
                <button type="submit" class="submit-btn">Submit</button>
                <button type="button" class="signup-btn">Sign Up</button>
            </div>
        </form>
    </div>

</body>
</html>
